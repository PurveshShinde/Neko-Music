version: 2
updates:
  # Enable updates for Gradle/Android dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.plugin.compose"
          - "org.jetbrains.kotlin.plugin.serialization"
          - "com.google.devtools.ksp"
          - "gradle-wrapper"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "com.google.android.gms:play-services-cronet"
        versions:
          - "18.1.1"

  # Enable updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
