name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.actor, 'dependabot') }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Configure CI Memory and Daemon
      run: |
        mkdir -p "$HOME/.gradle"
        cat << 'EOF' > "$HOME/.gradle/gradle.properties"
        org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
        kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
        org.gradle.parallel=false
        org.gradle.vfs.watch=false
        EOF

    - name: Run Unit Tests
      run: |
        chmod +x gradlew
        ./gradlew :core:testDebugUnitTest :lyrics:testDebugUnitTest :app:testArm64FossDebugUnitTest --no-daemon --no-parallel

    - name: Check Signing Secrets Availability
      id: check_secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          echo "Production release signing secrets detected."
        else
          echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          echo "Signing secrets missing; falling back to unreleased debug build."
        fi

    - name: Decode Production Keystore
      if: steps.check_secrets.outputs.has_secrets == 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        KEYSTORE_DIR="$RUNNER_TEMP/keystore"
        KEYSTORE_PATH="$KEYSTORE_DIR/neko-release.keystore"

        mkdir -p "$KEYSTORE_DIR"
        chmod 700 "$KEYSTORE_DIR"

        echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"

        if [ ! -s "$KEYSTORE_PATH" ]; then
          echo "ERROR: Decoded keystore is empty or missing!"
          exit 1
        fi

        KEYSTORE_SIZE=$(wc -c < "$KEYSTORE_PATH")
        if [ "$KEYSTORE_SIZE" -lt 500 ]; then
          echo "ERROR: Decoded keystore is suspiciously small ($KEYSTORE_SIZE bytes)!"
          exit 1
        fi

        echo "Production keystore successfully decoded and verified ($KEYSTORE_SIZE bytes)."

    - name: Build ARM64 FOSS Release APK
      if: steps.check_secrets.outputs.has_secrets == 'true'
      env:
        RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/keystore/neko-release.keystore
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew :app:assembleArm64FossRelease --no-daemon --no-parallel

    - name: Build Universal FOSS Release APK
      if: steps.check_secrets.outputs.has_secrets == 'true'
      env:
        RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/keystore/neko-release.keystore
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew :app:assembleUniversalFossRelease --no-daemon --no-parallel

    - name: Verify Release APK Signatures
      if: steps.check_secrets.outputs.has_secrets == 'true'
      run: |
        set -euo pipefail
        APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)/apksigner
        EXPECTED_FINGERPRINT="7c4a2d940be15f5a058d13bc0904d773fd04937f3947b521011671572b415f0b"

        for apk in app/build/outputs/apk/arm64Foss/release/app-arm64-foss-release.apk app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk; do
          echo "Verifying signature on $apk..."
          "$APKSIGNER" verify --verbose "$apk"

          CERT_FINGERPRINT=$("$APKSIGNER" verify --print-certs "$apk" | grep -i "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          if [ "$CERT_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: Signature fingerprint mismatch on $apk!"
            echo "Expected: $EXPECTED_FINGERPRINT"
            echo "Found:    $CERT_FINGERPRINT"
            exit 1
          fi
          echo "Verified permanent Neko release key on $apk ($CERT_FINGERPRINT)"
        done

    - name: Upload Release APKs
      if: steps.check_secrets.outputs.has_secrets == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: Neko-Music-Release-APKs
        path: |
          app/build/outputs/apk/arm64Foss/release/app-arm64-foss-release.apk
          app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk
        if-no-files-found: error

    - name: Build Debug APK (Pull Request fallback)
      if: steps.check_secrets.outputs.has_secrets != 'true'
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.android"
        keytool -genkeypair \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -keyalg RSA \
          -validity 10000
        ./gradlew :app:assembleArm64FossDebug --no-daemon --no-parallel

    - name: Upload Debug APK
      if: steps.check_secrets.outputs.has_secrets != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: Neko-Music-Debug-APK
        path: app/build/outputs/apk/arm64Foss/debug/app-arm64-foss-debug.apk
        if-no-files-found: error

    - name: Clean Up Temporary Keystore
      if: always()
      run: |
        set -euo pipefail
        if [ -d "$RUNNER_TEMP/keystore" ]; then
          rm -rf "$RUNNER_TEMP/keystore"
          echo "Cleaned up temporary keystore directory."
        fi
        rm -f keystore.jks
